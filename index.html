<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NoisyBoy Control</title>
    <style>
        /* Evita selección de texto y comportamientos táctiles molestos */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #eceff1; 
            text-align: center; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { 
            background: #3f51b5; 
            color: white; 
            padding: 15px; 
            font-size: 22px; 
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .status { margin: 15px; color: #546e7a; font-weight: bold; }
        
        .connect-btn { 
            background: #455a64; 
            color: white;
            padding: 12px 25px; 
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background 0.3s;
        }

        .connect-btn:active { background: #263238; }

        /* Contenedor principal para centrar las flechas */
        .controls-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
        }

        .joystick-container {
            display: grid;
            grid-template-areas: 
                ". up ." 
                "left stop right" 
                ". down .";
            gap: 15px;
            justify-items: center;
            align-items: center;
        }
        
        button {
            border: none; 
            color: white; 
            cursor: pointer;
            font-weight: bold; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn-move { 
            background: #e67e22; 
            width: 85px; 
            height: 95px; 
            border-radius: 18px; 
            font-size: 28px;
        }

        .btn-move:active { background: #d35400; transform: scale(0.95); }

        .btn-stop-main { 
            background: #4caf50; 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            grid-area: stop;
            font-size: 18px;
        }

        .btn-stop-main:active { background: #388e3c; transform: scale(0.95); }
        
        .up { grid-area: up; } 
        .down { grid-area: down; }
        .left { grid-area: left; } 
        .right { grid-area: right; }

        /* Controles Sierra */
        .sierra-container { 
            margin: 30px 0; 
            display: flex; 
            gap: 20px; 
        }

        .btn-sierra {
            width: 120px;
            height: 55px;
            border-radius: 12px;
            font-size: 16px;
        }

        .btn-boot { background: #00bcd4; }
        .btn-boot:active { background: #0097a7; transform: scale(0.95); }

        .btn-stop-sierra { background: #9c27b0; }
        .btn-stop-sierra:active { background: #7b1fa2; transform: scale(0.95); }

    </style>
</head>
<body>

    <div class="header">Pantalla de Control - NoisyBoy</div>
    
    <div class="status" id="status">Estado: Desconectado</div>
    <button class="connect-btn" onclick="conectarBT()">🔗 Conectar Bluetooth</button>

    <div class="controls-wrapper">
        <div class="joystick-container">
            <button class="btn-move up" onmousedown="enviar('f')" onmouseup="enviar('s')" ontouchstart="enviar('f')" ontouchend="enviar('s')">▲</button>
            <button class="btn-move left" onmousedown="enviar('l')" onmouseup="enviar('s')" ontouchstart="enviar('l')" ontouchend="enviar('s')">◀</button>
            <button class="btn-stop-main" onclick="enviar('s')">STOP</button>
            <button class="btn-move right" onmousedown="enviar('r')" onmouseup="enviar('s')" ontouchstart="enviar('r')" ontouchend="enviar('s')">▶</button>
            <button class="btn-move down" onmousedown="enviar('b')" onmouseup="enviar('s')" ontouchstart="enviar('b')" ontouchend="enviar('s')">▼</button>
        </div>
    </div>

    <div class="sierra-container">
        <button class="btn-sierra btn-boot" onclick="enviar('p')">BOOT (ON)</button>
        <button class="btn-sierra btn-stop-sierra" onclick="enviar('a')">STOP (OFF)</button>
    </div>

    <script>
        let caracteristicaBT = null;

        async function conectarBT() {
            const SERVICE_UUID = "00001101-0000-1000-8000-00805f9b34fb";
            try {
                const dispositivo = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'NoisyBoy' }],
                    optionalServices: [SERVICE_UUID]
                });
                
                const servidor = await dispositivo.gatt.connect();
                const servicio = await servidor.getPrimaryService(SERVICE_UUID);
                caracteristicaBT = await servicio.getCharacteristic(SERVICE_UUID);
                
                document.getElementById('status').innerText = "Estado: Conectado a NoisyBoy";
                document.getElementById('status').style.color = "#2e7d32";
            } catch (error) {
                console.log("Error: " + error);
            }
        }

        async function enviar(comando) {
            if (caracteristicaBT) {
                try {
                    const encoder = new TextEncoder();
                    await caracteristicaBT.writeValue(encoder.encode(comando));
                } catch (e) {
                    console.log("Error al enviar");
                }
            }
        }
    </script>
</body>
</html>
